<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <link rel="stylesheet" href="main.css">

</head>
<body>
    <section class="main">
      <div class="left-section">
    <div class="text">

      <h1>Get paid early</h1>
      <h2>save automatically</h2>
      <h2>all your pay.</h2>
      <p>Supports small businesses with simple invoicing,</p>
      <p>powerful integrations, and cash flow management tools.</p>
    </div>

    <div class="email">

      <input type="email" placeholder="Your business email">
      <button>Get started
        <i class="fas fa-arrow-up-right-from-square"></i>
      </button>
    </div>

    <div class="brands">

      <h1>Klarna.</h1>
      <h1>coinbase</h1>
      <img src="assets/paw.PNG" alt="paw">
      <h1>instacart</h1>
    </div>
      </div>

    <div class="customer">

      <img src="assets/dipa.PNG" alt="dipa">
      <div class="text">
        <span class="name">Dipa Inhouse</span>
        <span class="subname">dipainhouse@gmail.com</span>
      </div>

      <div class="invoice">
        <p>Invoice</p>
        <h2>$1,876,580</h2>
        <p>April 21, 2024</p>
      </div>

      <div class="card">
        <div class="crd">
        <i class="fas fa-credit-card"></i>
        <span>Credit Card</span>
        </div>
        <label class="option">
          <input type="radio" name="payment">
          <span class="checkmark"></span>
        </label>
      </div>

      <div class="account">
        <div class="crd">
        <i class="fas fa-bank"></i>
        <span>Bank Account</span>
        </div>
        <label class="option">
          <input type="radio" name="payment">
          <span class="checkmark"></span>
        </label>
      </div>

      <div class="pay">
        <button>Pay</button>
      </div>

  </section>
</body>
</html>
